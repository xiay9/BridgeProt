run:
  seed: 42

data:
  include_speaker: true
  include_turn_id: true
  use_audio: false
  use_video: false
  use_audio_summary: false
  audio_summary_backend: opensmile_egemaps

model:
  model_name: Qwen/Qwen3.5-9B
  tokenizer_name: null
  trust_remote_code: false
  video_fps: 1.0

protocol:
  max_records: 32
  max_evidence_per_record: 4
  max_bridge_chars: 256
  max_explanation_chars: 512
  require_explanation: true
  enforce_temporal_precedence: false

training:
  method: sft
  run_name: qwen35_9b
  seed: 42
  train_split: train
  eval_split: valid
  target_mode: minimal
  max_length: 4096
  max_train_dialogues: null
  max_eval_dialogues: null
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.0
  num_train_epochs: 3.0
  warmup_ratio: 0.03
  logging_steps: 10
  save_total_limit: 2
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  wandb_enabled: false
  wandb_project: BridgeProt
  load_in_4bit: false
  load_in_8bit: false
  load_in_16bit: true
